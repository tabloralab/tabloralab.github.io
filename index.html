<style>
:root{--navy:#0b2a6b;--blue:#0a6bd6;--accent:#0a6bd6;--lab:#0a8cf0;--bg:#f5f8fd;--card:#fff;--ink:#0e1a33;--mute:#56627a;--line:#dbe3f0;--tab:#0b2a6b}
@media(prefers-color-scheme:dark){:root{--bg:#0b1428;--card:#12203d;--ink:#eaf0fb;--mute:#9db0cf;--line:#26385c;--tab:#8fb8ff;--lab:#4db3ff;--accent:#2d86ee}
  header img,.hero img,footer img{background:#eef4ff;border-radius:12px;padding:5px}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",Roboto,system-ui,-apple-system,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.word{font-weight:800;letter-spacing:-.02em}
.word b{color:var(--tab)}.word i{color:var(--lab);font-style:normal}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px}
header img{height:34px;width:auto}
header .word{font-size:1.4rem}
header .sp{flex:1}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:9px 16px;border:2px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.or{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.hero{max-width:1100px;margin:0 auto;padding:36px 16px 12px;display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:28px;align-items:center}
.hero img{width:100%;height:auto}
.hero h1{margin:0;font-size:clamp(2.3rem,8vw,4.2rem);line-height:1}
.hero p{margin:12px 0 0;max-width:46ch;color:var(--mute);font-size:1.1rem}
.hero .tag{font-style:italic;color:var(--accent);font-weight:700;font-size:1.3rem;margin-top:10px}
.hero .sub{margin-top:4px;letter-spacing:.14em;font-weight:600;font-size:.95rem;color:var(--tab)}
@media(max-width:700px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.hero img{max-width:240px}}
.bar{max-width:1100px;margin:18px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:10px}
.bar input{flex:1 1 220px;font:inherit;padding:11px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.chip{font:inherit;padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
#count{color:var(--mute);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--blue));border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card[data-cat=Stock]{--c:#0a6bd6}.card[data-cat=Sales]{--c:#ff7a00}.card[data-cat=Camp]{--c:#1b8a5a}.card[data-cat=Finance]{--c:#7a3fd1}.card[data-cat=Tools]{--c:#0b2a6b}
.card h3{margin:0;font-size:1.15rem;line-height:1.25}
.card .top{display:flex;justify-content:space-between;align-items:start;gap:8px}
.ico{font-size:1.8rem;line-height:1}
.badge{font-size:.8rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.badge.Ready{border-color:#1b8a5a;color:#1b8a5a}.badge.Testing{border-color:#c77700;color:#c77700}
.card p{margin:0;color:var(--mute);flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.empty{padding:30px;text-align:center;color:var(--mute)}
dialog{border:none;border-radius:14px;padding:22px;max-width:520px;width:calc(100% - 28px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(5,12,30,.6)}
dialog h2{margin:0 0 6px}dialog ul{padding-left:20px}
#show{position:fixed;inset:0;z-index:20;background:linear-gradient(135deg,#0b2a6b,#0a4fb0);color:#fff;display:none;flex-direction:column;padding:20px;padding-top:max(20px,env(safe-area-inset-top))}
#show.on{display:flex}
#show .slide{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:900px;margin:0 auto;width:100%}
#show .big{font-size:clamp(4rem,16vw,8rem);line-height:1}
#show h2{font-size:clamp(2rem,6vw,3.6rem);margin:8px 0;line-height:1.1}
#show p{font-size:clamp(1.1rem,2.6vw,1.6rem);max-width:40ch;margin:0 0 14px}
#show li{font-size:clamp(1rem,2.2vw,1.35rem);margin:4px 0}
#show .ctl{display:flex;gap:10px;align-items:center;justify-content:space-between}
#show .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4)}
footer{border-top:1px solid var(--line);padding:22px 16px;text-align:center;color:var(--mute);font-size:.92rem}
footer img{height:26px;vertical-align:middle;margin-right:6px}
@media(prefers-reduced-motion:no-preference){.hero img{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}}
</style>
</head>

<script>
/* ===== EDIT HERE: one block per app. Paste your link in url. ===== */
var APPS=[
{name:"Inventory System",cat:"Stock",status:"Ready",icon:"📦",url:"",
 short:"Receive and issue stock and always see what is on hand.",
 features:["Receiving and issuing records","Live on-hand stock","Separate or single user setup"]},
{name:"Overall Stock Database",cat:"Stock",status:"Ready",icon:"🗄️",url:"",
 short:"One searchable database of stock across all projects.",
 features:["Dashboard and search","Import from Excel","Filter by project and item"]},
{name:"Quotation to Payment Workflow",cat:"Sales",status:"Ready",icon:"🧾",url:"",
 short:"Follow each job from quotation to closed payment.",
 features:["Quotation, approval, PO, delivery note, invoice","Payment received tracking","Numbered documents"]},
{name:"Tailoring Manager",cat:"Sales",status:"Ready",icon:"🧵",url:"",
 short:"Customers, orders and body measurements for a tailor shop.",
 features:["Services, customers and orders","Measurements per garment","English and Urdu"]},
{name:"Camp Accommodation Tracker",cat:"Camp",status:"Ready",icon:"🛏️",url:"",
 short:"See empty rooms and empty beds at a glance.",
 features:["Room and bed status","Empty bed count","Easy updates"]},
{name:"Camp Maintenance Portal",cat:"Camp",status:"Ready",icon:"🔧",url:"",
 short:"Staff report problems and the office tracks the repair.",
 features:["Employee, office and admin roles","Email alerts","Status dashboard"]},
{name:"Offline Payments App",cat:"Finance",status:"Ready",icon:"💳",url:"",
 short:"Supplier and customer payments that work without internet.",
 features:["Runs offline on Android","Backup and restore","Free to host"]},
{name:"MediHisab Pro",cat:"Finance",status:"Ready",icon:"💊",url:"",
 short:"Accounts for a medical distribution business.",
 features:["Purchases and stores","Urdu and English","Offline sync"]},
{name:"PDF Library",cat:"Tools",status:"Ready",icon:"📚",url:"",
 short:"Keep PDF books in one library and search inside them.",
 features:["Search by file name or text","Built-in reader","Works on PC and Android"]},
{name:"Excel Dashboard Builder",cat:"Tools",status:"Testing",icon:"📊",url:"",
 short:"Upload an Excel file and get charts and dashboards.",
 features:["Automatic charts","Table design and forms","Export to Excel or PDF"]},
{name:"Text Style Design Studio",cat:"Tools",status:"Testing",icon:"🔤",url:"",
 short:"Design styled company-name text and export it.",
 features:["Ready text styles","Colour and effects","Export as PNG or SVG"]}
];
/* ===== END OF EDIT AREA ===== */

var CATS=["All","Stock","Sales","Camp","Finance","Tools"];
var cat="All",q="";
function $(id){return document.getElementById(id)}
function h(tag,attrs,kids){var e=document.createElement(tag);
  for(var k in (attrs||{})){if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k])}
  (kids||[]).forEach(function(c){e.appendChild(c)});return e}
function okUrl(u){return /^https?:\/\//i.test(u||"")}
function openBtn(a,cls){
  if(okUrl(a.url))return h("a",{"class":"btn "+(cls||""),href:a.url,target:"_blank",rel:"noopener noreferrer",text:"Open app"});
  var b=h("button",{"class":"btn "+(cls||""),type:"button",disabled:"",text:"Link coming soon"});return b}

function chips(){var box=$("chips");box.textContent="";
  CATS.forEach(function(c){var b=h("button",{"class":"chip",type:"button","aria-pressed":String(c===cat),text:c});
    b.onclick=function(){cat=c;chips();draw()};box.appendChild(b)})}

function match(a){
  if(cat!=="All"&&a.cat!==cat)return false;
  var t=(a.name+" "+a.short+" "+a.cat+" "+a.features.join(" ")).toLowerCase();
  return t.indexOf(q.toLowerCase())>-1}

function draw(){
  var g=$("grid");g.textContent="";
  var list=APPS.filter(match);
  $("count").textContent=list.length+(list.length===1?" app":" apps");
  if(!list.length){g.appendChild(h("div",{"class":"empty",text:"No apps match. Clear the search or choose All."}));return}
  list.forEach(function(a){
    var d=h("button",{"class":"btn alt",type:"button",text:"Details"});
    d.onclick=function(){details(a)};
    g.appendChild(h("article",{"class":"card","data-cat":a.cat},[
      h("div",{"class":"top"},[h("span",{"class":"ico","aria-hidden":"true",text:a.icon}),h("span",{"class":"badge "+a.status,text:a.status})]),
      h("h3",{text:a.name}),h("p",{text:a.short}),
      h("div",{"class":"row"},[openBtn(a),d])]))})}

function details(a){
  var dlg=$("dlg");dlg.textContent="";
  var ul=h("ul");a.features.forEach(function(f){ul.appendChild(h("li",{text:f}))});
  var x=h("button",{"class":"btn alt",type:"button",text:"Close"});x.onclick=function(){dlg.close()};
  dlg.appendChild(h("h2",{text:a.icon+" "+a.name}));
  dlg.appendChild(h("p",{text:a.cat+" app. Status: "+a.status+"."}));
  dlg.appendChild(h("p",{text:a.short}));dlg.appendChild(ul);
  dlg.appendChild(h("div",{"class":"row"},[openBtn(a),x]));
  dlg.showModal()}

/* Presentation mode */
var si=0;
function slide(){
  var a=APPS[si],s=$("slide");s.textContent="";
  var ul=h("ul");a.features.forEach(function(f){ul.appendChild(h("li",{text:f}))});
  s.appendChild(h("div",{"class":"big","aria-hidden":"true",text:a.icon}));
  s.appendChild(h("h2",{text:a.name}));s.appendChild(h("p",{text:a.short}));s.appendChild(ul);
  $("pos").textContent=(si+1)+" of "+APPS.length}
function go(n){si=(si+n+APPS.length)%APPS.length;slide()}
function start(){si=0;slide();$("show").classList.add("on");
  var el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen().catch(function(){})}
function stop(){$("show").classList.remove("on");if(document.fullscreenElement)document.exitFullscreen()}
$("present").onclick=start;$("close").onclick=stop;
$("next").onclick=function(){go(1)};$("prev").onclick=function(){go(-1)};
document.addEventListener("keydown",function(e){
  if(!$("show").classList.contains("on"))return;
  if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key==="Escape")stop()});
var tx=0;$("show").addEventListener("touchstart",function(e){tx=e.touches[0].clientX},{passive:true});
$("show").addEventListener("touchend",function(e){var d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60)go(d<0?1:-1)});

$("q").addEventListener("input",function(e){q=e.target.value;draw()});
$("yr").textContent=new Date().getFullYear();
chips();draw();
</script>
